name: publish

# Builds and pushes both images to Docker Hub.
#
# Deliberately NOT triggered by every push to main. The images bundle an
# Xray-core snapshot fetched at build time, so "publish on every commit" would
# hand subscribers a different kernel several times a day for changes that never
# touched the proxy path. A tag is a decision; a commit is not.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Pin the bundled Xray-core (e.g. v26.7.28). Empty = latest prerelease at build time."
        required: false
        default: ""
      tag:
        description: "Extra tag to publish alongside the computed ones (e.g. edge)."
        required: false
        default: ""

concurrency:
  # A second tag pushed while the first is still building would otherwise race
  # for the `latest` pointer.
  group: publish
  cancel-in-progress: false

jobs:
  # The images are what people run. Refusing to publish one that does not pass
  # the same checks main does costs six minutes and prevents the failure mode
  # where a broken release is only discovered by whoever pulled it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      xray_version: ${{ steps.xray.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

      # Resolve the Xray version ONCE, here, and hand the same answer to both
      # images.
      #
      # Letting each Dockerfile ask for "latest" independently meant the two
      # builds could disagree: they run in parallel, and a snapshot landing
      # between them ships a panel that validates configs with one kernel and
      # nodes that run another — the exact drift core/internal/kernel exists to
      # prevent. Resolving here also halves the API calls and puts the one that
      # remains behind a token, on a step whose failure names itself instead of
      # surfacing as a build error two stages deep.
      - name: Resolve the Xray-core version
        id: xray
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ inputs.xray_version }}
        run: |
          set -euo pipefail
          if [ -n "${PINNED}" ]; then
            echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
            echo "pinned to ${PINNED}"
            exit 0
          fi
          for attempt in 1 2 3; do
            v=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1" \
                  | jq -r '.[0].tag_name // empty') && [ -n "$v" ] && break
            echo "attempt $attempt failed, retrying" >&2
            sleep $((attempt * 5))
          done
          if [ -z "${v:-}" ]; then
            echo "could not resolve the latest Xray-core release from api.github.com" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "both images will bundle Xray-core $v"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            image: chiral-core
            dockerfile: deploy/panel/Dockerfile.core
          - name: agent
            image: chiral-agent
            dockerfile: deploy/agent/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated only for the final stage (adduser, mkdir); the Go,
      # npm and download stages are pinned to the build platform in the
      # Dockerfiles, so this stays cheap.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          # `latest` only from a semver tag, never from a manual run: a
          # dispatch is usually a one-off, and having it move `latest` is how
          # an experiment reaches everybody who pulls.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=chiral-${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION

      # Retried because the failure it guards against is not a defect: the
      # v0.1.0 run published core and lost agent on the same commit that had
      # published both minutes earlier, which is registry or cache flakiness,
      # not something in this repository. Losing one image of a pair leaves
      # `latest` half-published — the panel pullable and the agent not.
      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Resolved once in verify, so core and agent cannot end up bundling
          # different kernels.
          build-args: |
            XRAY_VERSION=${{ needs.verify.outputs.xray_version }}
          # GITHUB_TOKEN lifts the anonymous GitHub API rate limit the Xray
          # stage would otherwise hit — 60/hour is shared across every runner
          # on this hosted IP, and exhausting it fails the build with a 404 on
          # a nonsense URL rather than anything that names the cause.
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Retry the push once
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XRAY_VERSION=${{ needs.verify.outputs.xray_version }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          # No cache-to on the retry: if the cache export is what failed,
          # repeating it is the one thing guaranteed not to help.
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Report what was published
        run: |
          echo "### chiral-${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
