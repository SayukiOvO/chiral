name: publish

# Builds and pushes both images to Docker Hub.
#
# Deliberately NOT triggered by every push to main. The images bundle an
# Xray-core snapshot fetched at build time, so "publish on every commit" would
# hand subscribers a different kernel several times a day for changes that never
# touched the proxy path. A tag is a decision; a commit is not.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Optional exact Xray-core release. Empty = latest published release at build time."
        required: false
        default: ""
      tag:
        description: "Extra tag to publish alongside the computed ones (e.g. edge)."
        required: false
        default: ""

concurrency:
  # A second tag pushed while the first is still building would otherwise race
  # for the `latest` pointer.
  group: publish
  cancel-in-progress: false

jobs:
  # The images are what people run. Refusing to publish one that does not pass
  # the same checks main does costs six minutes and prevents the failure mode
  # where a broken release is only discovered by whoever pulled it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      xray_version: ${{ steps.xray.outputs.version }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Resolve the Xray version ONCE, then test the same release that both
      # images will bundle. This prevents a release-only kernel incompatibility
      # from passing a different kernel gate on main and reaching Docker Hub.
      - name: Resolve the Xray-core version
        id: xray
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ inputs.xray_version }}
        run: |
          set -euo pipefail
          if [ -n "${PINNED}" ]; then
            v="${PINNED}"
            source=pinned
          else
            v=
            source=resolved
            for attempt in 1 2 3; do
              v=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                    "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1" \
                    | jq -r '.[0].tag_name // empty') && [ -n "$v" ] && break
              echo "attempt $attempt failed, retrying" >&2
              sleep $((attempt * 5))
            done
            if [ -z "$v" ]; then
              echo "could not resolve the latest Xray-core release from api.github.com" >&2
              exit 1
            fi
          fi
          case "$v" in v*) ;; *) v="v$v" ;; esac
          if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid Xray version (expected one line matching vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"
          echo "$source Xray-core $v; both images and release tests will use it"

      - name: Install release Xray-core for integration tests
        env:
          XRAY_VERSION: ${{ steps.xray.outputs.version }}
        run: sh .github/workflows/install-xray.sh "$XRAY_VERSION" "$RUNNER_TEMP/xray"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build Go binaries
        run: |
          go build -o bin/chiral-core ./core/cmd/core
          go build -o bin/chiral-agent ./agent/cmd/agent
      - name: test Go (real Xray integrations required)
        env:
          CHIRAL_XRAY_BIN: ${{ runner.temp }}/xray/xray
          XRAY_LOCATION_ASSET: ${{ runner.temp }}/xray
        run: bash .github/workflows/test-go-with-xray.sh

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Lint protobuf definitions
        run: buf lint
      - name: Generated protobuf code is in sync
        run: |
          buf generate
          git diff --exit-code -- proto

      # The compose file and its example .env drift in both directions and each
      # direction fails silently. A variable the example documents but compose
      # never forwards is set by the operator and ignored; a variable compose
      # substitutes but the example never mentions is one nobody knows exists.
      # Both have shipped.
      - name: Compose and .env.example agree
        run: |
          set -euo pipefail
          cd deploy/panel
          # Only ${...} substitutions: the rest are fixed container paths and
          # listen addresses, deliberately not operator-tunable.
          grep -oE '\$\{CHIRAL_[A-Z_]+' docker-compose.yml | cut -c3- | sort -u > /tmp/sub
          grep -oE '^#? *CHIRAL_[A-Z_]+' .env.example | tr -d '# ' | sort -u > /tmp/doc
          fail=0
          if undocumented=$(comm -23 /tmp/sub /tmp/doc) && [ -n "$undocumented" ]; then
            echo "::error::compose substitutes these, .env.example never mentions them:"
            echo "$undocumented"; fail=1
          fi
          if dropped=$(comm -13 /tmp/sub /tmp/doc) && [ -n "$dropped" ]; then
            echo "::error::.env.example documents these, compose never forwards them:"
            echo "$dropped"; fail=1
          fi
          [ "$fail" = 0 ] && echo "all $(wc -l < /tmp/sub) variables line up"
          exit "$fail"

      # One version string for the binaries and both images, so a `docker
      # images` and a `chiral-core --version` cannot disagree about what the
      # same run produced. A dispatch is not a release and must not claim a
      # version number that looks like one.
      - name: Resolve the build version
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-${GITHUB_REF_NAME}.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            image: chiral-core
            dockerfile: deploy/panel/Dockerfile.core
          - name: agent
            image: chiral-agent
            dockerfile: deploy/agent/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated only for the final stage (adduser, mkdir); the Go,
      # npm and download stages are pinned to the build platform in the
      # Dockerfiles, so this stays cheap.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          # `latest` only from a semver tag, never from a manual run: a
          # dispatch is usually a one-off, and having it move `latest` is how
          # an experiment reaches everybody who pulls.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=chiral-${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION

      # Retried because the failure it guards against is not a defect: the
      # v0.1.0 run published core and lost agent on the same commit that had
      # published both minutes earlier, which is registry or cache flakiness,
      # not something in this repository. Losing one image of a pair leaves
      # `latest` half-published — the panel pullable and the agent not.
      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Resolved once in verify, so core and agent cannot end up bundling
          # different kernels.
          build-args: |
            XRAY_VERSION=${{ needs.verify.outputs.xray_version }}
            VERSION=${{ needs.verify.outputs.version }}
          # GITHUB_TOKEN lifts the anonymous GitHub API rate limit the Xray
          # stage would otherwise hit — 60/hour is shared across every runner
          # on this hosted IP, and exhausting it fails the build with a 404 on
          # a nonsense URL rather than anything that names the cause.
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Retry the push once
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            XRAY_VERSION=${{ needs.verify.outputs.xray_version }}
            VERSION=${{ needs.verify.outputs.version }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          # No cache-to on the retry: if the cache export is what failed,
          # repeating it is the one thing guaranteed not to help.
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Report what was published
        env:
          IMAGE: chiral-${{ matrix.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            printf '### %s\n' "$IMAGE"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Prebuilt binaries, for deploying without Docker. The panel carries its own
  # frontend, so a release is two executables and an Xray — no asset directory
  # to unpack or keep in step with the binary that serves it.
  binaries:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before the Go build, always: package web compiles dist/ into the panel
      # binary, and a checkout that skipped this produces one that serves no UI
      # and says so only at runtime.
      - name: Build the frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Build every target
        env:
          VERSION: ${{ github.ref_name }}
          STAMP: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir="chiral-${VERSION}-${os}-${arch}"
            mkdir -p "build/$dir"
            for cmd in core agent; do
              # -X main.version, or the binary reports the placeholder a local
              # build uses and every node in the console claims to run 0.1.0-dev.
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -trimpath -ldflags="-s -w -X main.version=${STAMP}" \
                -o "build/$dir/chiral-$cmd" "./$cmd/cmd/$cmd"
            done
            cp deploy/systemd/* "build/$dir/"
            cp README.md "build/$dir/"
            tar -czf "out/${dir}.tar.gz" -C build "$dir"
          done
          cd out && sha256sum ./*.tar.gz > SHA256SUMS
          ls -lh

      # -X is silent when it misses: rename the variable, move it to another
      # package, or make it a const again, and the build still succeeds while
      # every binary reports the development placeholder. v0.3.1 shipped that
      # way, which made the console's per-node version column say 0.1.0-dev for
      # every node no matter what was installed on it. Ask a binary instead of
      # trusting the flag.
      - name: Check the version actually got stamped
        env:
          STAMP: ${{ needs.verify.outputs.version }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for cmd in core agent; do
            got=$("./build/chiral-${VERSION}-linux-amd64/chiral-$cmd" --version)
            [ "$got" = "$STAMP" ] || {
              echo "chiral-$cmd reports '$got', expected '$STAMP' — the -X ldflag no longer reaches main.version" >&2
              exit 1
            }
            echo "chiral-$cmd: $got"
          done

      # A release with notes, rather than bare tags. The annotation on the tag
      # is already written for this — reusing it beats a generated changelog
      # nobody wrote.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
          XRAY_VERSION: ${{ needs.verify.outputs.xray_version }}
        run: |
          set -euo pipefail
          {
            git tag -l --format='%(contents)' "$VERSION"
            echo
            echo "## Container images"
            echo
            echo '```'
            echo "docker pull ${REGISTRY_USER}/chiral-core:${VERSION#v}"
            echo "docker pull ${REGISTRY_USER}/chiral-agent:${VERSION#v}"
            echo '```'
            echo
            echo "Bundled Xray-core: \`${XRAY_VERSION}\`"
          } > notes.md
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            out/*.tar.gz out/SHA256SUMS
