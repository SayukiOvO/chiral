# Panel-side deployment: Core (+ frontend, served by Core once web/ is built).
# TLS termination for the HTTP API can sit behind caddy/nginx; the gRPC
# endpoint's TLS is configured directly on Core (CHIRAL_TLS_CERT/KEY).
services:
  core:
    build:
      context: ../..
      dockerfile: deploy/panel/Dockerfile.core
    image: ${CHIRAL_CORE_IMAGE:-ghcr.io/sayukiovo/chiral-core:latest}
    restart: unless-stopped
    ports:
      - "8080:8080" # REST API / frontend
      - "8443:8443" # agent gRPC
    environment:
      CHIRAL_DB_PATH: /var/lib/chiral/chiral.db
      CHIRAL_HTTP_LISTEN: ":8080"
      CHIRAL_GRPC_LISTEN: ":8443"
      # Address agents dial; set to your panel's public host:port.
      CHIRAL_GRPC_PUBLIC_ADDR: ${CHIRAL_GRPC_PUBLIC_ADDR:?set to public host:port for agents}
      CHIRAL_ADMIN_TOKEN: ${CHIRAL_ADMIN_TOKEN:?set a strong admin token}
      # Encrypts private key material (REALITY keys, post-quantum seeds) at
      # rest. Without it they are stored in the clear.
      # Generate with: openssl rand -base64 32
      CHIRAL_SECRET_KEY: ${CHIRAL_SECRET_KEY:?set a secret key, e.g. `openssl rand -base64 32`}
      # Bundled in the image; the panel validates every rendered config with
      # `xray -test` before storing or pushing it. This one is the FLOOR — see
      # CHIRAL_KERNEL_DIR.
      # Where the join snippet tells a node to pull the agent from. Set it to
      # match wherever you publish; the default is this project's own image.
      CHIRAL_AGENT_IMAGE: ${CHIRAL_AGENT_IMAGE:-}
      CHIRAL_XRAY_BIN: /usr/local/bin/xray
      # Where the panel keeps a binary per Xray version any node runs.
      #
      # On the data volume on purpose: `xray -test` only answers for the build
      # that runs it, so once a node has been upgraded the panel needs THAT
      # build to judge its configs. Put this on a container-local path and every
      # restart forgets every version, leaving the panel validating an upgraded
      # fleet's configs against the one binary baked into the image.
      CHIRAL_KERNEL_DIR: /var/lib/chiral/kernels
      # Optional. Unauthenticated GitHub API calls are limited to 60/hour per
      # IP, which one panel never approaches — but a shared egress IP might,
      # and then upgrades quietly stop being offered.
      CHIRAL_GITHUB_TOKEN: ${CHIRAL_GITHUB_TOKEN:-}
      # Email: address verification and one-time sign-in codes. Leave the
      # host empty to run without email — it is simply not offered as a
      # second factor then.
      CHIRAL_SMTP_HOST: ${CHIRAL_SMTP_HOST:-}
      CHIRAL_SMTP_PORT: ${CHIRAL_SMTP_PORT:-587}
      CHIRAL_SMTP_USER: ${CHIRAL_SMTP_USER:-}
      CHIRAL_SMTP_PASSWORD: ${CHIRAL_SMTP_PASSWORD:-}
      CHIRAL_SMTP_FROM: ${CHIRAL_SMTP_FROM:-}
      # starttls (default) | implicit | none. A server that does not offer
      # STARTTLS is an error rather than a silent downgrade.
      CHIRAL_SMTP_TLS: ${CHIRAL_SMTP_TLS:-starttls}
      # Comma-separated addresses or CIDRs whose X-Forwarded-For the panel
      # believes. Set it ONLY to the reverse proxy in front of Core. Left
      # empty, per-IP rate limits key off the peer address; set wrongly, any
      # caller can pick their own bucket with one header and the limits stop
      # meaning anything.
      CHIRAL_TRUSTED_PROXY: ${CHIRAL_TRUSTED_PROXY:-}
      # Record which source addresses each user connects from. Off by
      # default: it is the only feature that records where people connect
      # from, and that should be a decision rather than a default.
      #
      # Switching it on injects statsUserOnline into every node's config,
      # which is a new config version and therefore one Xray restart per node
      # — dropping every live connection on that node, once.
      CHIRAL_ONLINE_RECORD: ${CHIRAL_ONLINE_RECORD:-off}
      # End-user portal: off | closed | open.
      #   off    — the /api/portal/* routes are not registered at all.
      #   closed — subscribers sign in; registration is refused. Accounts are
      #            handed out with one-time claim links from the users page.
      #   open   — anyone may register, optionally gated by the shared code
      #            below.
      # Anything other than off REQUIRES CHIRAL_SECRET_KEY: the portal stores
      # each subscription token recoverably so it can show someone their own
      # link, and Core refuses to start rather than keep those in the clear.
      CHIRAL_PORTAL_MODE: ${CHIRAL_PORTAL_MODE:-off}
      CHIRAL_PORTAL_INVITE_CODE: ${CHIRAL_PORTAL_INVITE_CODE:-}
      # Directory of built frontend assets. Empty means Core serves no files
      # at all — right for development (vite has its own server) and for a
      # deployment that terminates static content at nginx or Caddy.
      CHIRAL_WEB_DIR: ${CHIRAL_WEB_DIR:-/usr/share/chiral/web}
      # CHIRAL_TLS_CERT: /certs/fullchain.pem
      # CHIRAL_TLS_KEY: /certs/privkey.pem
    volumes:
      - chiral-data:/var/lib/chiral
      # - ./certs:/certs:ro

volumes:
  chiral-data:
