# Opt-in override for a dedicated test node or an approved interruption window.
# Applying this to an existing Agent recreates its container and stops the
# direct-Xray child, interrupting established connections. Read-only API access
# does not make deployment interruption-free. For tests on a live host, use the
# independent ../3x-ui-lab/docker-compose.yml project instead.
# This override does not make 3x-ui the active runtime owner.
services:
  chiral-agent:
    environment:
      CHIRAL_RUNTIME_PROVIDER: 3x-ui-shadow
      CHIRAL_3XUI_URL: "${CHIRAL_3XUI_URL:?set the node-local 3x-ui base URL}"
      CHIRAL_3XUI_TOKEN_FILE: /run/secrets/chiral-3x-ui-token
      CHIRAL_3XUI_ALLOW_PUBLIC: "${CHIRAL_3XUI_ALLOW_PUBLIC:-0}"
    volumes:
      - type: bind
        source: "${CHIRAL_3XUI_TOKEN_FILE_HOST:?set an absolute host token path}"
        target: /run/secrets/chiral-3x-ui-token
        read_only: true
