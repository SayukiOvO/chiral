syntax = "proto3";

package chiral.v1;

option go_package = "github.com/SayukiOvO/chiral/proto/chiral/v1;chiralv1";

// AgentService is served by Core. Agents dial out to Core (scheme A):
// nodes only need outbound network access and never expose inbound ports.
service AgentService {
  // Register exchanges a one-time join token for this node's long-term
  // credential. The join token is invalidated as soon as registration
  // succeeds. Called once, before the first Channel.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Channel is the persistent bidirectional stream that carries all frames.
  // The node's long-term credential is presented via gRPC metadata key
  // "x-chiral-credential". The first agent frame MUST be Hello.
  rpc Channel(stream AgentFrame) returns (stream CoreFrame);
}

message RegisterRequest {
  string join_token = 1;
  string agent_version = 2;
  string hostname = 3;
}

message RegisterResponse {
  string node_id = 1;
  // Long-term per-node credential. Core stores only a hash; the credential
  // can be revoked individually without affecting other nodes.
  string credential = 2;
}

// ---- Agent -> Core frames ----

message AgentFrame {
  oneof frame {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    StatsReport stats = 3;
    ConfigAck config_ack = 4;
    Event event = 5;
    OnlineReport online = 6;
    XrayStatus xray_status = 7;
    XrayRelayRequest xray_relay_request = 8;
  }
}

// Hello is the first frame after the stream is established.
message Hello {
  string node_id = 1;
  string agent_version = 2;
  // Version of the managed Xray-core binary; empty if not installed yet.
  string xray_version = 3;
  string public_ip = 4;
  // GOOS/GOARCH of the node, e.g. "linux/amd64".
  //
  // Core needs it to pick the right release asset, and the agent is the only
  // thing that knows it. Inferring it panel-side — from a hostname, a label, an
  // operator's memory — is how a node gets told to install a binary for the
  // wrong architecture, which fails at exec time with nothing useful to say.
  string platform = 5;
}

// Heartbeat carries lightweight system metrics and liveness.
message Heartbeat {
  double cpu_percent = 1;
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  // Instantaneous network throughput, bytes per second.
  uint64 net_tx_bps = 6;
  uint64 net_rx_bps = 7;
  XrayState xray_state = 8;
  // Version of the currently applied config; 0 if none applied yet.
  int64 config_version = 9;
  // Version of the Xray-core binary the RUNNING process was started from,
  // canonical form (no leading "v"). Empty when nothing is running.
  //
  // Hello carries a version too, but Hello only happens at stream setup. An
  // in-place binary upgrade does not drop the stream, so without it here Core
  // could never observe that an upgrade landed — it would be judging the
  // outcome of a change it cannot see.
  string xray_version = 10;

  // Version of the binary the NEXT start would use.
  //
  // Two fields rather than one because the two answer different questions and
  // the upgrade path needs both: "did the new kernel actually take over?" is
  // about the running process, while "which kernel do I validate this config
  // against?" is about the one on disk. They agree in the steady state and
  // disagree exactly when something has gone wrong — a swap that did not
  // restart, a rollback, a crash-looping kernel — which is precisely when
  // collapsing them into one number would report the reassuring half.
  string installed_xray_version = 11;
}

enum XrayState {
  XRAY_STATE_UNSPECIFIED = 0;
  XRAY_STATE_RUNNING = 1;
  XRAY_STATE_STOPPED = 2;
  XRAY_STATE_ERROR = 3;
}

// StatsReport carries traffic deltas since the previous report, never
// absolute counter values, so an Xray-core restart cannot skew totals.
// Implemented in M3; shape is a draft until then.
message StatsReport {
  repeated StatEntry entries = 1;
}

message StatEntry {
  StatScope scope = 1;
  // Inbound/outbound tag, or the per-credential email for STAT_SCOPE_USER.
  string name = 2;
  uint64 uplink_bytes = 3;
  uint64 downlink_bytes = 4;
}

enum StatScope {
  STAT_SCOPE_UNSPECIFIED = 0;
  STAT_SCOPE_INBOUND = 1;
  STAT_SCOPE_OUTBOUND = 2;
  STAT_SCOPE_USER = 3;
}

// ConfigAck reports the outcome of a ConfigPush.
message ConfigAck {
  int64 version = 1;
  bool applied = 2;
  // Failure detail (e.g. local `xray -test` output) when applied is false.
  string error = 3;
}

// OnlineReport lists the source addresses currently connected, per credential.
//
// This is an ABSOLUTE SNAPSHOT, and the deliberate exception to the delta rule
// StatsReport follows. The two have opposite failure modes: traffic counters
// reset to zero when Xray restarts, so absolute values would skew totals —
// whereas an observation set that empties on restart means "we are not
// observing", never "zero devices, lift the limit". Sending the whole set each
// time is what lets Core tell those apart.
//
// Measured against Xray 26.3.27, and the reason for `complete`: a user's online
// count is the number of DISTINCT SOURCE ADDRESSES, not sessions — three
// concurrent connections from one address report as one. Loopback sources are
// excluded from Xray's accounting entirely.
message OnlineReport {
  int64 at_unix = 1;
  // False when the agent could not enumerate everything this round (a timeout
  // partway through the fan-out).
  //
  // Core keeps what such a round did contain and marks the resulting count
  // partial, rather than discarding it: the addresses it DID see are real, and
  // dropping the round would make a persistently slow node look quiet instead
  // of unreliable. What the flag forbids is reading a truncated set as "these
  // are all the addresses in use" — so the count travels with `partial` and is
  // documented as a floor, never a total.
  bool complete = 2;
  // Sent every round even when empty, so silence stays unambiguous. An empty
  // list from Xray has three different causes — the policy is off, nobody is
  // connected, or every source was loopback — and `xray api
  // statsgetallonlineusers` answers all three with `{}` and exit 0.
  repeated OnlineUser users = 3;
}

message OnlineUser {
  // The per-credential stats key, i.e. user.StatsEmail.
  string email = 1;
  repeated OnlineIP ips = 2;
}

message OnlineIP {
  string ip = 1;
  int64 last_seen_unix = 2;
}

// ---- Xray-core runtime upgrade ----

// XrayStatus reports progress through one install. Sent at every phase change,
// not only at the end: an upgrade that stalls mid-download and one that was
// never received look identical from Core, and the difference decides whether
// an operator waits or intervenes.
message XrayStatus {
  // The version this status is about, canonical form (no leading "v"). Carried
  // explicitly rather than inferred from "the current install": a status can
  // arrive after Core has moved on, and applying it to the wrong version would
  // mark the new attempt with the old one's outcome.
  string version = 1;
  XrayInstallPhase phase = 2;
  // Human-readable detail. On failure this carries the kernel's own stderr,
  // which is the only thing that tells an admin what to fix.
  string message = 3;
  int64 at_unix = 4;
  // What is running and what is on disk as of this status. Duplicated from
  // Heartbeat so an outcome does not have to wait for the next beat to be
  // believed — the whole judgement hangs on these two.
  string running_version = 5;
  string installed_version = 6;
}

enum XrayInstallPhase {
  XRAY_INSTALL_PHASE_UNSPECIFIED = 0;
  XRAY_INSTALL_PHASE_DOWNLOADING = 1;
  XRAY_INSTALL_PHASE_VERIFYING = 2;
  // On disk, checksum matched, binary answers `version` — but not yet running.
  XRAY_INSTALL_PHASE_INSTALLED = 3;
  // Restarted into the new binary; the data-path probe is in flight.
  XRAY_INSTALL_PHASE_ACTIVATING = 4;
  // A CLIENT GOT ONLINE through this node on the new binary. The only phase
  // that justifies promoting a canary.
  //
  // Not "the process is up", and not "the kernel answers its own API" — both
  // are true of a kernel whose transport layer is broken and whose subscribers
  // are all dark, which is the failure an upgrade actually causes. The agent
  // runs a throwaway client kernel from the binary under test, with the client
  // outbound Core rendered from the same template a subscription comes from,
  // and fetches a URL through this node's own inbound.
  XRAY_INSTALL_PHASE_ACTIVE = 5;
  // Running, but nothing confirmed traffic flows: no profile bound, no
  // xray-json client template, no enabled user, or the pre-upgrade baseline was
  // already failing. Deliberately NOT folded into ACTIVE: "it did not fail" and
  // "it works" are different claims, and only the second should let an operator
  // roll an upgrade out to the rest of the fleet. The reason travels in
  // XrayStatus.message — each of these is a one-line fix once you know which.
  XRAY_INSTALL_PHASE_INCONCLUSIVE = 6;
  // Could not download, verify, or start. The previous binary may or may not
  // be serving; ROLLED_BACK is the one that says it is.
  XRAY_INSTALL_PHASE_FAILED = 7;
  // Failed AND the previous binary is running again. Terminal and safe.
  XRAY_INSTALL_PHASE_ROLLED_BACK = 8;
}

// XrayRelayRequest asks Core for one chunk of an archive the agent could not
// fetch itself.
//
// Pull, not push, and one chunk per request. A node's send queue holds 16
// frames; a 21 MB archive is far more than that, so pushing it would either
// drop chunks or crowd out the config pushes and user operations sharing that
// queue. Making the agent ask for the next chunk caps the relay at one frame in
// flight per node, which needs no rate limit to tune and cannot starve anything
// — the cost is one round trip per chunk, which for a once-per-release transfer
// is not worth optimising away.
message XrayRelayRequest {
  string version = 1;
  int64 offset = 2;
}

message Event {
  EventKind kind = 1;
  string message = 2;
  int64 at_unix = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_XRAY_CRASHED = 1;
  EVENT_KIND_XRAY_RESTARTED = 2;
  EVENT_KIND_ERROR = 3;
}

// ---- Core -> Agent frames ----

message CoreFrame {
  oneof frame {
    ConfigPush config_push = 1;
    UserOp user_op = 2;
    Command command = 3;
    OnlinePolicy online_policy = 4;
    XrayInstall xray_install = 5;
    XrayChunk xray_chunk = 6;
  }
}

// XrayInstall tells a node to fetch, verify and switch to a specific build.
//
// Core names the version; the agent never decides for itself what to run. That
// is what makes the fleet's state knowable — and it is also why Core can always
// validate configs for whatever a node is running, because it fetched that
// build too before naming it.
message XrayInstall {
  // Canonical version, no leading "v".
  string version = 1;
  // GitHub asset URL for this node's platform. The agent tries this first: it
  // is one hop instead of two, and it keeps 20 MB per node off the panel's
  // uplink.
  string download_url = 2;
  // Lowercase hex SHA-256 of the archive, taken from the release's .dgst file.
  // Required — an unverified binary is not installed, whichever route it came
  // by. The relay is not a trusted path either: it is the same bytes through a
  // different pipe, and the panel is exactly the machine an attacker would want
  // to be standing on.
  string sha256 = 3;
  // Whether Core will serve this archive over XrayRelayRequest if the direct
  // fetch fails. False when Core could not obtain the archive itself, in which
  // case a node without egress simply cannot be upgraded — and should say so
  // rather than retrying a route that does not exist.
  bool relay_available = 4;
  // Restart into the new binary once installed. False stages it on disk without
  // touching the running kernel, which is how a fleet-wide upgrade separates
  // "everyone has the bytes" from "everyone is running it".
  bool activate = 5;
}

// XrayChunk is one slice of an archive, in reply to an XrayRelayRequest.
message XrayChunk {
  string version = 1;
  int64 offset = 2;
  bytes data = 3;
  // True on the slice that ends the archive.
  bool last = 4;
  // Set when the request cannot be served (unknown version, read failure).
  // Non-empty means data is meaningless and the agent should stop asking.
  string error = 5;
}

// OnlinePolicy switches the agent's online-address polling on or off.
//
// Off by default and off unless Core says otherwise: polling costs one
// `xray api` subprocess per round plus one per online user, and an operator
// who has not asked for the feature should not pay for it.
//
// Deliberately carries no list of users to watch. Core knows which credentials
// are limited, but sending that list would hand every rented VPS the display
// names, user ids and profile ids of subscribers it does not serve — the
// isolation that per-node credentials buy in the first place. The agent only
// ever sees its own online users; the filtering happens at Core, for free.
message OnlinePolicy {
  bool enabled = 1;
  // Seconds between rounds. The interval IS the sampling error: a session that
  // opens and closes between two rounds is invisible, and Xray drops an address
  // from the set within about two seconds of disconnection — there is no
  // lingering window to catch it in.
  int32 interval_seconds = 2;
}

// ConfigPush delivers a complete config.json. Core has already validated it
// with `xray -test` before pushing. Rollback is expressed as a ConfigPush of
// an older version's content (with a new version number); the agent keeps no
// local history.
message ConfigPush {
  int64 version = 1;
  bytes config_json = 2;

  // One Xray client outbound, tagged "probe-out", that dials THIS node's own
  // inbound with a real subscriber's credential.
  //
  // It travels with the config because it is rendered from the same templates
  // and the same variables, and pairing them is what keeps a node from ever
  // holding a probe for a different version of its own access points.
  //
  // The agent wraps it in a throwaway config with a local SOCKS inbound and
  // fetches a URL through it, which is the only check that answers the question
  // an upgrade actually raises: can a customer still get online? Asking the
  // kernel's own API instead proves the process parsed its config and is
  // listening — true of a kernel whose transport layer is broken and whose
  // subscribers are all dark.
  //
  // Empty when the panel had nothing to render one from: no profile bound, no
  // xray-json template, no entitled user. That is reported as INCONCLUSIVE, not
  // as a pass — a node whose data path nobody could check has not been checked.
  bytes probe_outbound_json = 3;

  // Where the probe fetches from. Empty means the agent's own default.
  //
  // Carried from Core so one setting fixes a whole fleet: an endpoint that is
  // unreachable from the region a node sits in would otherwise make every
  // canary there inconclusive, with no way to correct it but a redeploy.
  string probe_url = 4;
}

// UserOp adds/removes a client on a live inbound via Xray-core's
// HandlerService, without restarting the core.
// Implemented in M3; account payload shape is finalized then.
message UserOp {
  UserOpKind kind = 1;
  string inbound_tag = 2;
  // Per-credential stats key, e.g. "alice@tokyo-reality".
  string email = 3;
  // JSON-encoded account object (uuid/password/flow...), draft until M3.
  bytes account_json = 4;
}

enum UserOpKind {
  USER_OP_KIND_UNSPECIFIED = 0;
  USER_OP_KIND_ADD = 1;
  USER_OP_KIND_REMOVE = 2;
}

// Command is a small imperative from Core.
message Command {
  oneof cmd {
    RestartXray restart_xray = 1;
    ReportNow report_now = 2;
  }
}

// RestartXray asks the agent to restart the Xray-core process.
message RestartXray {}

// ReportNow asks the agent to send a Heartbeat (and StatsReport once
// implemented) immediately.
message ReportNow {}
